name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 静态规范 + API 表面
        run: |
          npm test
          npm run test:api
          npm run test:v280
          npm run verify:release
      - name: 下游 4 资产自检
        run: |
          mkdir -p /tmp/downstream/ui-kit/test
          cp tokens.css components.css nvui-api.js tokens.json package.json /tmp/downstream/ui-kit/
          cp test/downstream-check.js /tmp/downstream/ui-kit/test/
          cd /tmp/downstream/ui-kit
          node test/downstream-check.js

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 校验发布契约
        run: |
          npm test
          npm run test:api
          npm run test:v280
          npm run verify:release
      - name: 打包
        run: npm run pack
      - name: 创建 / 更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ui-kit-*.zip
            dist/SHA256SUMS
            dist/manifest.json
          generate_release_notes: true
